plugins {
    id 'org.gretty' version "4.1.4"
}

gretty {
    contextPath = '/'
    // Flattened TeaVM output (app.js, assets/, scripts/ at root — matches index.html).
    extraResourceBase 'build/dist/site'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

sourceSets.main.java.srcDirs = ["src/"]
sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

project.ext.mainClassName = "com.mygdx.game.TeaVMBuilder"
eclipse.project.name = appName + "-teavm"

dependencies {
    implementation "com.github.xpenatan.gdx-teavm:backend-teavm:$gdxTeaVMVersion"
    implementation project(':core')
}

def teavmOutputDir = layout.buildDirectory.dir("dist/webapp/webapp")
def teavmAppJs = layout.buildDirectory.file("dist/webapp/webapp/app.js")
def siteDir = layout.buildDirectory.dir("dist/site")

tasks.register("buildJavaScript", JavaExec) {
    dependsOn classes
    setDescription("Transpile bytecode to JavaScript via TeaVM")
    mainClass.set(project.mainClassName)
    setClasspath(sourceSets.main.runtimeClasspath)
    // Required so :clean invalidates this task; without outputs Gradle keeps it UP-TO-DATE
    // even after app.js was deleted, which breaks Vercel deploys.
    outputs.file(teavmAppJs)
    inputs.files(sourceSets.main.allSource, sourceSets.main.runtimeClasspath)
}

tasks.register("copyWebapp", Copy) {
    setDescription("Copy custom webapp resources (index.html, etc.) into the dist folder")
    dependsOn tasks.named("buildJavaScript")
    from "webapp"
    into "build/dist/webapp"
}

tasks.register("stageWebDist") {
    setDescription("Flatten TeaVM webapp/ output for static hosting (Vercel, Gretty)")
    dependsOn tasks.named("copyWebapp")
    inputs.dir(teavmOutputDir)
    outputs.dir(siteDir)
    doLast {
        def nested = teavmOutputDir.get().asFile
        def appJs = teavmAppJs.get().asFile
        if (!appJs.isFile()) {
            throw new GradleException(
                "TeaVM did not produce ${appJs}. " +
                "Contents of ${nested.parentFile}: ${nested.parentFile.list()?.toList() ?: '[]'}"
            )
        }
        delete siteDir.get().asFile
        siteDir.get().asFile.mkdirs()
        copy {
            from nested
            into siteDir.get().asFile
        }
        copy {
            from "webapp"
            into siteDir.get().asFile
        }
    }
}

build.dependsOn tasks.named("stageWebDist")

tasks.register("run") {
    description = "Run the JavaScript application hosted via a local Jetty server at http://localhost:8080/"
    dependsOn(tasks.named("stageWebDist"), tasks.named("jettyRun"))
}
