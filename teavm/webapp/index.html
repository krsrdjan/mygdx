<!DOCTYPE html>
<html>
    <head>
        <title>My GDX Game</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="theme-color" content="#000000">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                touch-action: none;
                overscroll-behavior: none;
                -webkit-tap-highlight-color: transparent;
                -webkit-user-select: none;
                user-select: none;
            }
            body {
                position: fixed;
                inset: 0;
            }
            #canvas {
                display: block;
                width: 100vw;
                height: 100vh;
                width: 100dvw;
                height: 100dvh;
                border: none;
                outline: none;
                touch-action: none;
            }
            #canvas[hidden] {
                display: none;
            }
            #rotate-overlay {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                background: #000;
                color: #fff;
                font-family: system-ui, -apple-system, sans-serif;
                text-align: center;
                padding: 24px;
                touch-action: none;
            }
            #rotate-overlay.visible {
                display: flex;
            }
            #rotate-overlay .icon {
                font-size: 48px;
                line-height: 1;
                margin-bottom: 8px;
            }
            #rotate-overlay h1 {
                margin: 0;
                font-size: 22px;
                font-weight: 600;
            }
            #rotate-overlay p {
                margin: 0;
                font-size: 16px;
                color: #aaa;
                max-width: 280px;
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <div id="rotate-overlay" aria-live="polite">
            <div class="icon" aria-hidden="true">↻</div>
            <h1>Rotate your device</h1>
            <p>Landscape mode is required to play.</p>
        </div>
        <canvas id="canvas" hidden></canvas>
        <script type="text/javascript" charset="utf-8" src="app.js"></script>
        <script>
            (function () {
                var MOBILE_SHORT_SIDE_MAX = 768;
                var mobileWebPlay = (
                    ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
                    Math.min(window.screen.width, window.screen.height) <= MOBILE_SHORT_SIDE_MAX
                );
                window.__MYGDX_MOBILE_WEB__ = mobileWebPlay;

                var overlay = document.getElementById("rotate-overlay");
                var canvas = document.getElementById("canvas");
                var gameStarted = false;

                function isLandscape() {
                    return window.innerWidth > window.innerHeight;
                }

                function tryLockLandscape() {
                    if (!mobileWebPlay || !screen.orientation || !screen.orientation.lock) {
                        return;
                    }
                    screen.orientation.lock("landscape-primary").catch(function () {});
                }

                function updateOrientationGate() {
                    if (!mobileWebPlay) {
                        overlay.classList.remove("visible");
                        canvas.hidden = false;
                        return true;
                    }
                    if (isLandscape()) {
                        overlay.classList.remove("visible");
                        canvas.hidden = false;
                        tryLockLandscape();
                        return true;
                    }
                    overlay.classList.add("visible");
                    canvas.hidden = true;
                    return false;
                }

                function tryStartGame() {
                    if (gameStarted) {
                        updateOrientationGate();
                        return;
                    }
                    if (!updateOrientationGate()) {
                        return;
                    }
                    gameStarted = true;
                    main();
                }

                window.addEventListener("load", tryStartGame);
                window.addEventListener("orientationchange", tryStartGame);
                window.addEventListener("resize", tryStartGame);
            })();
        </script>
    </body>
</html>
