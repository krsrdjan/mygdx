# Builds the libGDX game (desktop + HTML) and deploys the HTML output to GitHub Pages.
# Requires an `html` Gradle module with GWT plugin and `:html:dist` task.
# Output: html/build/dist/ (index.html, JS, assets) → GitHub Pages

name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build desktop
        run: ./gradlew :desktop:dist --no-daemon

      - name: Build HTML
        run: ./gradlew :html:dist --no-daemon

      - name: Upload HTML artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: html/build/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      type: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
